name: Update repositories data

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repos-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const owner = "mrWheel";
          const token = process.env.GITHUB_TOKEN;

          async function request(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });

            if (!response.ok) {
              throw new Error(`Request failed (${response.status}) for ${path}`);
            }

            return response.json();
          }

          async function listPublicRepos() {
            const repos = [];
            const perPage = 100;
            let page = 1;

            while (true) {
              const batch = await request(
                `/users/${encodeURIComponent(owner)}/repos?type=public&sort=updated&per_page=${perPage}&page=${page}`
              );

              if (!Array.isArray(batch) || batch.length === 0) {
                break;
              }

              repos.push(...batch);

              if (batch.length < perPage) {
                break;
              }

              page += 1;
            }

            return repos;
          }

          async function resolvePagesInfo(repo) {
            const hasPages = !!repo.has_pages;
            if (!hasPages) {
              return { has_pages: false, pages_url: null };
            }

            try {
              const pagesInfo = await request(
                `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo.name)}/pages`
              );
              return {
                has_pages: true,
                pages_url: pagesInfo && pagesInfo.html_url ? pagesInfo.html_url : null
              };
            } catch (_) {
              return { has_pages: true, pages_url: null };
            }
          }

          function extractGitbookUrl(value) {
            const source = String(value || "");
            const match = source.match(/https?:\/\/[^\s)\]]+(?:gitbook\.io|app\.gitbook\.com)[^\s)\]]*/i);
            if (match && match[0]) {
              return match[0].replace(/[.,;)\]]+$/, "");
            }
            return null;
          }

          async function resolveGitbookInfo(repo) {
            const urlFromMeta = extractGitbookUrl(repo.homepage) || extractGitbookUrl(repo.description);
            if (urlFromMeta) {
              return { has_gitbook: true, gitbook_url: urlFromMeta };
            }

            try {
              const readmeData = await request(
                `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo.name)}/readme`
              );
              let readmeText = "";
              if (readmeData && readmeData.content && readmeData.encoding === "base64") {
                readmeText = Buffer.from(readmeData.content, "base64").toString("utf8");
              }
              const urlFromReadme = extractGitbookUrl(readmeText);
              if (urlFromReadme) {
                return { has_gitbook: true, gitbook_url: urlFromReadme };
              }
            } catch (_) {
              // No README or fetch error — treat as no GitBook
            }

            return { has_gitbook: false, gitbook_url: "" };
          }

          async function main() {
            const repos = await listPublicRepos();
            const output = [];

            for (const repo of repos) {
              if (!repo || String(repo.name || "").toLowerCase() === `${owner.toLowerCase()}.github.io`) {
                continue;
              }

              const pages = await resolvePagesInfo(repo);
              const gitbook = await resolveGitbookInfo(repo);
              output.push({
                name: repo.name,
                description: repo.description,
                html_url: repo.html_url,
                homepage: repo.homepage,
                language: repo.language,
                updated_at: repo.updated_at,
                stargazers_count: repo.stargazers_count,
                has_pages: pages.has_pages,
                pages_url: pages.pages_url,
                has_gitbook: gitbook.has_gitbook,
                gitbook_url: gitbook.gitbook_url
              });
            }

            fs.writeFileSync("repos.json", `${JSON.stringify(output, null, 2)}\n`, "utf8");
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit repos.json if changed
        run: |
          if git diff --quiet -- repos.json; then
            echo "No changes in repos.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git commit -m "chore: update repos.json"
          git push
